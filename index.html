<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00857A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{
  --bg:#F5F6F8;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--faint:#94A3B8;--line:#E8ECF1;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);
  --green:#15803D;--green-bg:#ECFDF3;--red:#C2410C;--red-bg:#FFF4ED;--amber:#B45309;--amber-bg:#FFFBEB;--blue:#1D4ED8;--blue-bg:#EFF4FF;
  --brand:#00857A;--brand-ink:#FFFFFF;--hero:#0B3D3A;--hero-2:#12524D;--accent:#3FE0A8;
}
[data-mode="dark"]{
  --bg:#0A0F1A;--card:#121A2A;--text:#E6EAF0;--muted:#94A3B8;--faint:#64748B;--line:#1F2A3C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --green:#4ADE80;--green-bg:#0F2A1C;--red:#FB923C;--red-bg:#2A170D;--amber:#FBBF24;--amber-bg:#2A2108;--blue:#93B4FF;--blue-bg:#13203D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;transition:background .3s,color .3s}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;letter-spacing:.5px}
.hello{flex:1;min-width:0}.hello b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .icon-btn{width:36px;height:36px;font-size:17px}
.top{gap:8px}
#brief{cursor:pointer}#brief span{flex:1}
.pbar{display:flex;gap:8px;margin-bottom:14px}
.pbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;font:600 13px Inter,sans-serif;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.pbtn:first-child{flex:1.3}.pbtn:last-child{flex:1}
.pbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn i{font-size:16px;color:var(--muted)}
[data-p]{cursor:pointer}
.pd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.pd-top h3{margin-bottom:2px}
.pd{border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.pd-r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.pd-r:first-child{border-top:0}.pd-r span{color:var(--muted);flex:none}.pd-r b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.drawer{position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:40;display:none}
.drawer.show{display:block}
.dr-panel{position:absolute;left:0;top:0;bottom:0;width:min(300px,82vw);background:var(--card);padding:18px 14px calc(18px + env(safe-area-inset-bottom));overflow:auto;animation:drIn .22s ease}
@keyframes drIn{from{transform:translateX(-100%)}to{transform:none}}
.dr-user{display:flex;align-items:center;gap:10px;margin-bottom:8px}.dr-user .logo{width:40px;height:40px}.dr-user b{display:block;font-size:15px}.dr-user small{color:var(--muted);font-size:12px}
.dr-h{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;margin:16px 4px 4px}
.dr-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--text);font:500 14px Inter,sans-serif;padding:11px 6px;border-radius:10px;text-align:left;cursor:pointer;text-decoration:none}
.dr-i:active{background:var(--bg)}.dr-i i{font-size:19px;color:var(--muted)}
.dr-note{font-size:12px;color:var(--muted);padding:6px}
.cstrip{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.cs-line{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font:13px Inter,sans-serif;color:var(--muted);cursor:pointer;text-align:left}
.cs-line b{color:var(--text);font-weight:600;min-width:70px}.cs-line span{flex:1}.cs-line .down{font-style:normal}
.totop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;display:none;align-items:center;gap:4px;border:0;border-radius:99px;padding:9px 14px;background:var(--text);color:var(--bg);font:600 12.5px Inter,sans-serif;box-shadow:var(--shadow);cursor:pointer}
.totop.show{display:flex}.totop i{font-size:15px}
.list-end{text-align:center;font-size:12px;color:var(--faint);padding:10px 0}
.rep .card{box-shadow:none;border:1px solid var(--line)}
.fbar{display:flex;gap:8px;margin-bottom:10px}
.fbar .pbtn{flex:1;box-shadow:none}.fbar .pbtn b{font-size:12px;color:var(--muted)}
.fbar .pbtn.ctx{flex:0 1 auto;max-width:55%;background:var(--brand);color:#fff;border-color:var(--brand)}.fbar .pbtn.ctx i{color:#fff}
.sheet-list .sl b{font-weight:600;color:var(--muted);margin-left:auto;padding-left:10px}.sheet-list .sl.on b{color:var(--brand)}
.sheet-list .sl{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.sheet-list .sl small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.sheet-list .sl.on{color:var(--brand);font-weight:600}.sheet-list .sl i{font-size:18px}
.sheet-list .sl-h{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;margin:12px 0 2px}
.flag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--amber-bg);color:var(--amber);margin:6px 4px 0 0}
.jr-cancel{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:9px 10px;border-radius:12px;background:var(--bg);font-size:12.5px;color:var(--muted);cursor:pointer}
.jr-cancel b{color:var(--text)}
.nw{white-space:nowrap}
.jr-disp{display:flex;gap:8px;align-items:flex-start;margin:-2px 0 10px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:12.5px;color:var(--muted)}
.jr-disp i{font-size:16px;color:var(--brand);margin-top:1px}.jr-disp b{color:var(--text)}.jr-disp small{display:block;font-size:11.5px;margin-top:2px}
.jr-head{font-size:13px;color:var(--muted);margin:-4px 0 2px}.jr-head b{color:var(--text);font-size:17px}
.jr-stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:10px 0 10px}.jr-stack i{display:block;height:100%}
.jr-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.jr-tiles div{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}.jr-tiles b{display:block;font-size:18px}.jr-tiles small{font-size:10.5px;color:var(--muted)}
.jr-grp{border-top:1px solid var(--line);padding:8px 0 2px;margin-top:6px}
.jr-gh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:2px}.jr-gh>b{font-size:13px}.jr-gh span{color:var(--muted)}.jr-gh span b{color:var(--text)}
.jr-gi{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}.jr-gi>b{font-size:15px}.jr-gi>i{color:var(--faint);font-size:16px}
.jr-dot2{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.jr-gn{flex:1;min-width:0;font-size:13px;font-weight:600}.jr-gn small{display:block;font-weight:400;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-funnel{font-size:13px;color:var(--muted);margin:-4px 0 2px;line-height:1.5}.jr-funnel b{color:var(--text);font-size:15px}.jr-funnel b.up{color:var(--green)}.jr-funnel b.down{color:var(--red)}.jr-funnel i.ti{font-size:13px;vertical-align:-1px}
.late-b,.late-t{font-style:normal;color:var(--red);font-weight:600}.late-b{font-size:10.5px;background:var(--red-bg);padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:1px}
.jr-now{display:flex;align-items:center;gap:8px;margin-top:8px;padding:9px 10px;border-radius:12px;border:1px dashed var(--line);font-size:12.5px;color:var(--muted);cursor:pointer}.jr-now span{flex:1}.jr-now b{color:var(--text)}.jr-now i{font-size:16px}
.jr-sum{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}.jr-sum b{color:var(--text);font-size:15px}
.jr-list{position:relative}
.jr-row{display:grid;grid-template-columns:26px 1fr 64px 30px 14px;align-items:center;gap:8px;padding:6px 0;position:relative;cursor:pointer}
.jr-row:before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--line)}
.jr-list .jr-row:first-child:before{top:50%}
.jr-list .jr-row:last-child:before{bottom:50%}
.jr-dot{width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-size:13px;position:relative;z-index:1}
.jr-name{font-size:13px;font-weight:600;min-width:0}.jr-name small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.jr-bar i{display:block;height:100%;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.jr-n{text-align:right;font-size:15px}
.jr-row.zero{opacity:.4}
.jr-sep{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;margin:6px 0 0 36px}
.st{color:var(--c,var(--muted));background:var(--bg)}
.pctx{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;font-size:18px;cursor:pointer}
.icon-btn:active{transform:scale(.95)}
.brief{background:var(--card);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);margin-bottom:14px}
.brief i{color:var(--brand);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:8px;border-radius:9px;font:500 12.5px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
/* Net COD card: same white card as the rest of Home; colour only on the numbers (teal total, green received, amber outstanding, red late). */
.hero{background:var(--card);color:var(--text);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero small{color:var(--muted);font-size:12px}.hero>.hero-top:first-child small{color:var(--text);font-size:14px;font-weight:600}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px;color:var(--brand)}[data-mode="dark"] .hero .big{color:var(--accent)}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hero-row div{background:var(--bg);border-radius:12px;padding:10px 12px}
.hero-row span{display:block;font-size:11.5px;color:var(--muted)}
.hero-row b{display:block;margin:2px 0;font-size:16px;font-weight:600}.hero-row div:first-child b{color:var(--green)}.hero-row div:last-child b{color:var(--amber)}
.hero-row em{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal;font-size:11px;color:var(--muted)}.hero-row .late{font-style:normal;color:var(--red);font-weight:600}
.hero-later{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--muted)}.hero-later i{font-size:15px}
.hero-bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 6px}.hero-bar i{display:block;height:100%;border-radius:9px;background:var(--brand);transition:width .8s cubic-bezier(.2,.8,.2,1)}[data-mode="dark"] .hero-bar i{background:var(--accent)}
.oc-kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px;text-align:center}
.oc-kp div{background:var(--bg);border-radius:12px;padding:10px 4px;cursor:pointer}.oc-kp b{display:block;font-size:18px}.oc-kp small{font-size:11px;color:var(--muted)}
.oc-warn{display:flex;align-items:center;gap:8px;margin-top:8px;padding:9px 10px;border-radius:12px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;font-weight:600;cursor:pointer}.oc-warn span{flex:1}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.tile{background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.tile .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .lbl i{font-size:15px}
.tile .v{font-size:24px;font-weight:700;margin:4px 0 0;letter-spacing:-.3px}
.tile .s{font-size:11.5px;color:var(--faint)}
.up{color:var(--green)}.down{color:var(--red)}
.h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.h b{font-size:14px;font-weight:600}.h span{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;background:var(--c)}
.legend b{color:var(--text);font-weight:600;margin-left:3px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.row:first-of-type{border-top:0}
.row span{color:var(--muted)}.row b{font-weight:600}
.act{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0}
.act .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.t-danger{background:var(--red-bg);color:var(--red)}.t-warning{background:var(--amber-bg);color:var(--amber)}.t-info{background:var(--blue-bg);color:var(--blue)}
.act b{display:block;font-size:13.5px;font-weight:600}.act small{color:var(--muted);font-size:12px}
.act .go{margin-left:auto;color:var(--faint)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{border:1px solid var(--line);border-radius:14px;padding:12px}
.cmp b{font-size:13px}.cmp .k{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap}.cmp .k em{font-style:normal;color:var(--text);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:26px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--line);transition:opacity .2s}
.stack i{display:block;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col small{font-size:11px;color:var(--muted)}.col .tot{font-size:11px;font-weight:600;color:var(--text)}
.col.dim .stack{opacity:.35}
.days{display:flex;align-items:flex-end;gap:4px;height:70px}
.days i{flex:1;background:var(--brand);border-radius:4px 4px 2px 2px;opacity:.85;min-height:3px;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.days-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.pay{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.pay .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.pay .r b{font-size:14px}
.pay .d{flex:1;min-width:0}.pay .d b{font-size:13px;font-weight:600;display:block}.pay .d small{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px}
.p-ok{background:var(--green-bg);color:var(--green)}.p-no{background:var(--red-bg);color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav div{max-width:460px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;color:var(--faint);font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.nav button i{font-size:22px}
.nav button.on{color:var(--brand)}
[data-mode="dark"] .nav button.on,[data-mode="dark"] .brief i{color:var(--accent)}
.badge{position:absolute;top:-4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:14px 0}
.empty i{display:block;font-size:26px;color:var(--green);margin-bottom:4px}
.title{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:2px 0 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);margin-bottom:10px}
.search i{color:var(--faint);font-size:18px}
.search input{flex:1;border:0;background:none;color:var(--text);font:400 14px Inter,sans-serif;padding:12px 0;outline:none}
.chip b{font-weight:600;margin-left:4px;opacity:.7}
.pc{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;border-left:4px solid var(--c,var(--line))}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-cn{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pc-who{color:var(--muted);font-size:13px;margin-top:2px}
.pc-meta{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}.pc-meta span:empty{display:none}.pc-meta span:nth-child(3){margin-left:auto}
.pc-meta b{color:var(--text);font-weight:600}
.pc-note{font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:10px}

(function () {
  if (window.google && google.script) return;
  window.EH_PWA = true; // installed app: notifications are possible

  function call(fn, args, ok, fail) {
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) { if (ok) ok(j.data); } else if (fail) fail(new Error(j.error)); })
      .catch(function () { if (fail) fail(new Error('No connection. Check the internet and try again.')); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () { call(k, Array.prototype.slice.call(arguments), ok, fail); };
    } });
  }
  window.google = { script: {
    run: runner(null, null),
    history: {
      push: function (state, _, hash) { history.pushState(state, '', '#' + hash); },
      replace: function (state, _, hash) { history.replaceState(state, '', '#' + hash); },

  } };
})();

<script>
// ---------- basics ----------
var root = document.documentElement;
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
root.setAttribute('data-brand', 'teal');
root.setAttribute('data-mode', store('eh_mode') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
function el(id) { return document.getElementById(id); }
function rs(n) { return 'Rs ' + Math.round(n || 0).toLocaleString('en-IN'); }
function n0(n) { return Math.round(n || 0).toLocaleString('en-IN'); }
function pct(x) { return x == null ? '—' : (Math.round(x * 1000) / 10) + '%'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

// Server calls: adds the token, shows the sync bar, sends to login on LOGIN_REQUIRED.

var animated = {};
function countUp(node) {
  var end = Number(node.getAttribute('data-n')), money = node.hasAttribute('data-rs');
  var id = node.getAttribute('data-k');
  if (id && animated[id] === end) { node.textContent = money ? rs(end) : n0(end); return; } // no re-animation on refresh
  if (id) animated[id] = end;
  var t0 = null, dur = 700;
  function step(t) {
    if (!t0) t0 = t;
    var p = Math.min((t - t0) / dur, 1), v = end * (1 - Math.pow(1 - p, 3));
    node.textContent = money ? rs(v) : n0(v);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function growBars(box) {

    setTimeout(function () {
      box.querySelectorAll('[data-w]').forEach(function (x) { x.style.width = x.getAttribute('data-w') + '%'; });
      box.querySelectorAll('[data-h]').forEach(function (x) { x.style.height = x.getAttribute('data-h') + '%'; });
    }, 30);
  });
}

// ---------- phone Back button ----------

// ---------- period: a month, all time, or a day range (Home and Cash) ----------
// sel = { month: '2026-10' | 'all' | '', range: null | { from, to, q } }   ('' month = latest)
function pkDay(d) { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Karachi' }).format(d); } // yyyy-MM-dd
function addDays(ymd, n) { var p = ymd.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n, 12)).toISOString().slice(0, 10); }
function quickRanges() { // same days as the server's appQuickRanges_
  var t = pkDay(new Date());
  return [['today', 'Today', t, t], ['yesterday', 'Yesterday', addDays(t, -1), addDays(t, -1)], ['d7', 'Last 7 days', addDays(t, -6), t], ['d30', 'Last 30 days', addDays(t, -29), t]];
}
function niceDay(ymd) { var p = ymd.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }); }
function rangeKey(r) { return 'r' + r.from + '_' + r.to; }
var COURIERS = [['all', 'All couriers'], ['trax', 'Trax'], ['leopards', 'Leopards']];

// One button shows the chosen period; tapping it opens a list (best practice: Shopify / Analytics).

function monthOf(sel) { return sel.month === 'this' ? curMonth() : sel.month === 'last' ? lastMonth() : sel.month; }
function monthName(k) { var p = k.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, 15)).toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' }); }
function periodLabel(sel, months, latest) {
  if (sel.range) {
    if (sel.range.q === 'custom') return niceDay(sel.range.from) + ' – ' + niceDay(sel.range.to);
    var q = quickRanges().filter(function (x) { return x[0] === sel.range.q; })[0];
    return q ? q[1] : 'Custom';
  }
  if (sel.month === 'this') return 'This month';
  if (sel.month === 'last') return 'Last month';

  if (m === 'all') return 'All time';

  el('lgAv').innerHTML = known ? esc(initials(USER)) : '<svg class="oword" style="height:64px;width:157px" aria-label="ORDI"><use href="#ordiWord"/></svg>';
  el('lgAv').classList.toggle('known', known);
  el('lgTitle').textContent = known ? 'Welcome back, ' + USER.split(' ')[0] : '';
  el('lgTitle').hidden = !known; // a new phone sees the ORDI wordmark instead of a title
  el('lgSub').textContent = known ? 'Enter your PIN' : STORE + ' · Enter your username and PIN';
  el('lgBrand').hidden = !known; el('lgBrandTx').textContent = '· ' + STORE;
  el('lgName').hidden = known;
  el('lgSwitch').hidden = !known;
  el('lgSwitch').textContent = known ? 'Not ' + USER.split(' ')[0] + '? Switch user' : '';
  lgPin = ''; drawDots(); el('lgErr').textContent = '';
}
function drawDots() {
  var n = Math.max(6, lgPin.length);
  el('lgDots').innerHTML = Array.from({ length: n }, function (_, i) { return '<i' + (i < lgPin.length ? ' class="on"' : '') + '></i>'; }).join('');
}
function lgShake(msg) {
  el('lgErr').textContent = msg;
  el('lgDots').classList.remove('shake'); void el('lgDots').offsetWidth; el('lgDots').classList.add('shake');
  lgPin = ''; drawDots();
}
function lgKey(k) {
  if (lgBusy) return;
  el('lgErr').textContent = '';
  if (k === 'del') lgPin = lgPin.slice(0, -1);
  else if (k === 'go') return lgSubmit();
  else if (lgPin.length < 8) lgPin += k;
  drawDots();
  if (lgPin.length === 8) lgSubmit(); // the longest PIN logs in by itself; shorter ones with →
}
function lgSubmit() {
  var n = USER || el('lgName').value.replace(/\s+/g, ' ').trim();
  if (!n) { el('lgErr').textContent = 'Enter your username'; el('lgName').focus(); return; }
  if (lgPin.length < 4) { lgShake('Enter your PIN'); return; }
  var p = lgPin;
  lgBusy = true; el('lgDots').classList.add('busy');
  google.script.run.withSuccessHandler(function (r) {
    lgBusy = false; el('lgDots').classList.remove('busy');
    TOKEN = r.token; USER = r.name; store('eh_token', TOKEN); store('eh_user', USER);
    el('login').hidden = true; lgPin = ''; el('lgName').value = '';
    if (r.mustChange) { showPinBox(true, p); return; } // PIN given by the admin: suggest a new one (Later is allowed)
    start();
  }).withFailureHandler(function (e) {
    lgBusy = false; el('lgDots').classList.remove('busy');
    lgShake((e && e.message) || 'Login failed');
  }).appLogin(n, p);
}
el('lgPad').onclick = function (e) { var b = e.target.closest('[data-k]'); if (b) lgKey(b.getAttribute('data-k')); };
document.addEventListener('keydown', function (e) {
  if (el('login').hidden || document.activeElement === el('lgName')) return;
  if (/^\d$/.test(e.key)) lgKey(e.key); else if (e.key === 'Backspace') lgKey('del'); else if (e.key === 'Enter') lgKey('go');
});
el('lgName').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); el('lgName').blur(); } };
el('lgName').oninput = function () { el('lgErr').textContent = ''; };
el('lgSwitch').onclick = function () { USER = ''; store('eh_user', ''); showLogin(); el('lgName').focus(); };
el('lgForgot').onclick = function () { el('lgErr').textContent = 'Ask the admin to set a new PIN for you. You can change it after you log in.'; };

// ---------- remembered filters ----------
// Kept until changed: Home + Cash period and courier, Parcels stage, NDR cases, Cash filters. Quick periods are
// saved by name ("Yesterday" stays yesterday tomorrow); a custom range keeps its dates.
function saveFilters() {
  var per = function (s) { return { month: s.month || '', courier: s.courier || 'all', range: s.range ? (s.range.q && s.range.q !== 'custom' ? { q: s.range.q } : s.range) : null }; };
  store('eh_f1', JSON.stringify({ h: per(H), c: per(C), p: P.filter, n: N.filter, pf: C.pf, bf: C.bf }));
}
function loadFilters() {
  var f; try { f = JSON.parse(store('eh_f1') || 'null'); } catch (e) { f = null; }
  if (!f) return;
  var qr = quickRanges();
  var range = function (r) { if (!r) return null; if (r.q && r.q !== 'custom') { var x = qr.filter(function (q) { return q[0] === r.q; })[0]; return x ? { from: x[2], to: x[3], q: r.q } : null; } return r.from && r.to ? r : null; };
  if (f.h) { H.month = f.h.month || 'this'; H.courier = f.h.courier || 'all'; H.range = range(f.h.range); }
  if (f.c) { C.month = f.c.month || 'all'; C.courier = f.c.courier || 'all'; C.range = range(f.c.range); }
  if (f.p) P.filter = f.p;
  if (f.n) N.filter = f.n;
  if (f.pf) C.pf = f.pf;
  if (f.bf) C.bf = f.bf;
}
loadFilters();

// ---------- change PIN (menu) / set your own PIN (after a temporary PIN) ----------
var pinForced = false;
function showPinBox(forced, currentPin) {
  pinForced = !!forced;
  el('pbTitle').textContent = forced ? 'Set your own PIN' : 'Change PIN';
  el('pbSub').textContent = forced ? 'Your PIN was given by the admin. We suggest choosing a new PIN only you know. You can also do this later from the menu.' : 'Enter your current PIN, then your new PIN twice';
  el('pbOld').value = currentPin || ''; el('pbOld').hidden = !!currentPin;
  el('pbNew').value = ''; el('pbNew2').value = ''; el('pbErr').textContent = '';
  el('pbCancel').textContent = forced ? 'Later' : 'Cancel';
  el('pinbox').hidden = false;
  setTimeout(function () { (currentPin ? el('pbNew') : el('pbOld')).focus(); }, 50);
}
el('btnPin').onclick = function () { closeDrawer(); showPinBox(false); };
el('pbCancel').onclick = function () { el('pinbox').hidden = true; if (pinForced) { pinForced = false; start(); } }; // Later: just use the app
el('pbGo').onclick = function () {
  var o = el('pbOld').value.trim(), n = el('pbNew').value.trim(), n2 = el('pbNew2').value.trim();
  if (!/^\d{4,8}$/.test(o)) { el('pbErr').textContent = 'Enter your current PIN'; return; }
  if (!/^\d{6,8}$/.test(n)) { el('pbErr').textContent = 'New PIN must be 6 to 8 digits'; return; }
  if (n !== n2) { el('pbErr').textContent = 'The two new PINs do not match'; return; }
  el('pbGo').disabled = true; el('pbGo').textContent = 'Saving…';
  google.script.run.withSuccessHandler(function (r) {
    TOKEN = r.token; store('eh_token', TOKEN);
    el('pbGo').disabled = false; el('pbGo').textContent = 'Save PIN';
    el('pinbox').hidden = true;
    toast('PIN changed · other phones are logged out');
    if (pinForced) start();
  }).withFailureHandler(function (e) {
    el('pbGo').disabled = false; el('pbGo').textContent = 'Save PIN';
    if (/LOGIN_REQUIRED/.test(e && e.message)) { el('pinbox').hidden = true; authFail(e); return; }
    el('pbErr').textContent = (e && e.message) || 'Could not change PIN';
  }).appChangePin(TOKEN, o, n);
};
el('pbNew2').onkeydown = function (e) { if (e.key === 'Enter') el('pbGo').click(); };

// ---------- start ----------
var started = false;
function start() {
  greet();
  drawPushBtn(); pushRefresh();
  // Opened from a notification: ?tab=ndr / returns / parcels
  var qt = new URLSearchParams(location.search).get('tab');
  if (qt && TABS[qt]) { showTab(qt); try { history.replaceState(history.state, '', location.pathname + location.hash); } catch (e) {} }
  loadHome(false);
  if (N.data) updateBadge();
  loadNdr(false);
  // Warm the other tabs in the background so switching is instant.
  setTimeout(function () { loadParcels(false); loadReturns(false); loadCash(false); }, 1500);
  if (!started) { started = true; setInterval(function () { if (TOKEN) loadNdr(false); }, 120000); }
}
if (TOKEN) start(); else showLogin();
// Launch screen stays at least 0.7 s from opening, then fades into the app.
(function () {
  el('bootStore').textContent = STORE;
  setTimeout(function () { el('boot').classList.add('out'); setTimeout(function () { el('boot').remove(); }, 350); }, Math.max(0, 700 - performance.now()));
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  // A new version takes over once it is downloaded: reload once so the team sees it now, not on the next open.
  var hadSw = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSw && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
