<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00857A">
<title>Courier queries</title>
<link rel="icon" href="ordi-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--ink:#0F172A;--ink2:#334155;--muted:#64748B;--faint:#94A3B8;--line:#E2E8F0;--line2:#F1F5F9;--head:#F8FAFC;--brand:#00857A;--brand-d:#00665D;--soft:#E7F5F2;--chip:#F1F5F9;--red:#B91C1C;--amber:#B45309;--amberbg:#FEF3C7;--redbg:#FEE2E2;--ok:#166534;--okbg:#DCFCE7;--blue:#2563EB}
@media (prefers-color-scheme:dark){:root{--bg:#0A0F1A;--card:#121A2A;--ink:#E6EAF0;--ink2:#CBD5E1;--muted:#94A3B8;--faint:#64748B;--line:#1F2A3C;--line2:#182234;--head:#0F1726;--soft:#12302D;--brand-d:#3FE0A8;--chip:#1A2436;--red:#F87171;--amber:#FBBF24;--amberbg:#2A220F;--redbg:#2A1313;--ok:#4ADE80;--okbg:#0F2A1C;--blue:#60A5FA}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{font-size:16px}@media (min-width:900px){input,select,textarea{font-size:14px}}
button{cursor:pointer}[hidden]{display:none!important}svg{flex:none}
.top{position:sticky;top:0;z-index:20;height:52px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.ttl{line-height:1.25;min-width:0}.ttl b{display:block;font-weight:600;font-size:15px}.ttl small{font-size:12px;color:var(--muted)}
.sp{flex:1}.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border:0;border-radius:7px;background:transparent;font-weight:500;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(15,23,42,.08);font-weight:600;color:var(--ink)}
.vr{width:1px;height:22px;background:var(--line)}.upd{font-size:12.5px;color:var(--muted);white-space:nowrap}
.rf{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rf.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.wrap{padding:12px 20px 20px;max-width:1500px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px}
.kc.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}.kc.none{opacity:.55}
.kc .l{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kc .n{grid-row:1/3;grid-column:2;display:flex;align-items:baseline;gap:4px}
.kc .n b{font-size:20px;font-weight:600;line-height:1.1}.kc .n span{font-size:12px;color:var(--muted)}.kc .s{font-size:11.5px;color:var(--muted)}
.c-bad b{color:var(--red)}.c-warn b{color:var(--amber)}.c-ok b{color:var(--ok)}.c-none b{color:var(--faint)}
.main{display:flex;gap:16px;align-items:flex-start}
.box{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tools{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input,.tools select{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--card)}
.tools input{width:220px;max-width:100%}.tools select{width:170px;max-width:45%}.tools .hint{font-size:12.5px;color:var(--muted);margin-left:auto}
.fl{display:flex;gap:6px;flex-wrap:wrap}.fl button{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;color:var(--muted)}
.fl button.on{border-color:var(--ink);color:var(--ink)}
.th,.tr{display:grid;grid-template-columns:140px 120px minmax(0,1fr) 72px 120px;align-items:center}
.th{background:var(--head);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}.th div{padding:8px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th div:first-child{padding-left:14px}
.tr{min-height:38px;border-bottom:1px solid var(--line2);cursor:pointer}.tr:hover{background:var(--head)}
.tr.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--brand)}.tr.ans{opacity:.65}
.tr>div{padding:0 8px;min-width:0}.tr>div:first-child{padding-left:14px}
.cn{font:500 12.5px 'Roboto Mono',ui-monospace,monospace}.city{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;min-width:0}.note span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd-t{flex:none;font-style:normal;font-size:11px;font-weight:600;background:var(--chip);color:var(--ink2);border-radius:4px;padding:1px 6px}
.again{flex:none;font-size:11px;font-weight:600;background:var(--redbg);color:var(--red);border-radius:4px;padding:1px 6px}
.pend{display:inline-block;min-width:58px;text-align:center;font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--chip);color:var(--muted)}
.pend.a{background:var(--amberbg);color:var(--amber)}.pend.r{background:var(--redbg);color:var(--red)}
.rp{display:inline-block;min-width:84px;text-align:center;font-size:12.5px;font-weight:600;border-radius:6px;padding:4px 0;border:1px solid #99D5CC;background:var(--card);color:var(--brand-d)}
.tr.sel .rp{background:var(--brand);border-color:var(--brand);color:#fff}.done-a{font-size:12.5px;color:var(--ok);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sh{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--head);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-size:13px}
.sh:first-of-type{border-top:0}.sh b{font-weight:600}.sh small{font-size:12.5px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:99px;flex:none}
.more{width:100%;height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;border:0;border-bottom:1px solid var(--line2);background:var(--head);font-size:13px;font-weight:500;color:var(--muted);text-align:left}
.more .ck{width:20px;height:20px;border-radius:99px;background:var(--okbg);color:var(--ok);display:flex;align-items:center;justify-content:center}.more em{font-style:normal;color:var(--brand-d);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.side{width:400px;flex:none;position:sticky;top:76px;max-height:calc(100vh - 92px);background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:14px 18px 12px;border-bottom:1px solid var(--line);flex:none}.ph .r1{display:flex;align-items:center;gap:8px}.ph .big{font:500 18px 'Roboto Mono',ui-monospace,monospace;word-break:break-all}
.cp{height:26px;padding:0 8px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.ph .r2{margin-top:4px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.back{display:none;border:0;background:none;color:var(--brand-d);font-weight:600;padding:0 4px 0 0;font-size:15px}
.pb{padding:14px 18px;display:flex;flex-direction:column;gap:13px;overflow-y:auto;min-height:0;flex:1}
.lb{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}.tx{font-size:14px;color:var(--ink2);margin-top:2px;white-space:pre-line}
.tl{display:flex;gap:10px}.tl .rail{display:flex;flex-direction:column;align-items:center;width:10px;flex:none}.tl .d{width:9px;height:9px;border-radius:99px;margin-top:4px}
.tl .ln{width:2px;flex:1;background:var(--line);margin-top:2px}.tl .c{padding-bottom:8px;min-width:0;font-size:13px;line-height:1.35}.tl .c small{display:block;font-size:11.5px;color:var(--faint)}
.k-track{background:var(--faint)}.k-us{background:var(--brand)}.k-you{background:var(--blue)}.k-bad{background:#DC2626}.k-ok{background:#16A34A}
.w-us{color:var(--brand-d);font-weight:600}.w-you{color:var(--blue);font-weight:600}.w-bad{color:var(--red);font-weight:600}.w-track,.w-ok{color:var(--ink2);font-weight:600}
.ag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.ag button{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13.5px;font-weight:500;padding:4px 8px;line-height:1.25}
.ag button.on{background:var(--brand);border-color:var(--brand);color:#fff}
textarea{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;min-height:54px;resize:vertical}
.now{border-radius:8px;background:var(--okbg);color:var(--ok);padding:9px 11px;font-size:13.5px}.now small{display:block;font-size:12px;opacity:.85}
.pn{flex:none;padding:10px 18px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}.pn label{font-size:12.5px;color:var(--muted);flex:none}
.pn input{flex:1;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:var(--card)}
.pf{flex:none;padding:10px 18px 14px;display:flex;gap:8px}.btn{height:40px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);padding:0 14px}
.btn.pri{flex:1;border:0;background:var(--brand);color:#fff}.btn:disabled{opacity:.5;pointer-events:none}
.ro{font-size:12.5px;color:var(--muted);background:var(--head);border-radius:8px;padding:9px 11px}
.pick{padding:40px 24px;text-align:center;color:var(--muted)}
.dh{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--head);border-bottom:1px solid var(--line);border-top:1px solid var(--line);flex-wrap:wrap}
.dh b{font-size:13px;font-weight:600}.dh small{font-size:12.5px;color:var(--muted)}.dh .sum{margin-left:auto;font-size:12.5px;color:var(--muted)}.dh .sum i{font-style:normal;color:var(--red);font-weight:600}
.fth,.ftr{display:grid;grid-template-columns:150px 100px 120px minmax(0,1fr) 190px 80px;align-items:center}
.res{font-size:13px;color:var(--ink2)}.res.bad{color:var(--red);font-weight:600}.res.warn{color:var(--amber)}.res.mute{color:var(--muted)}
.pcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.pc .l{font-size:13px;font-weight:600;color:var(--ink2)}
.pc b{display:block;font-size:28px;font-weight:600;line-height:1.2;margin-top:4px}.pc b.bad{color:var(--red)}.pc small{font-size:12px;color:var(--muted)}
.dth,.dtr{display:grid;grid-template-columns:170px repeat(6,minmax(0,1fr)) 110px 36px;align-items:center}
.dth{background:var(--head);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}.dth div{padding:10px 8px}.dth div:first-child{padding-left:16px}
.dtr{height:46px;border-bottom:1px solid var(--line2);font-size:13.5px;cursor:pointer}.dtr:hover{background:var(--head)}.dtr>div{padding:0 8px}.dtr>div:first-child{padding-left:16px;font-weight:500}
.z{color:var(--line)}.dtr .bad{color:var(--red);font-weight:600}.dtr .warn{color:var(--amber);font-weight:600}.dtr .mute{color:var(--muted)}
.foot{padding:10px 16px;font-size:12.5px;color:var(--muted);background:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0F172A;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;z-index:60;max-width:90vw}
.err{margin:30px auto;max-width:520px;background:var(--redbg);color:var(--red);border-radius:12px;padding:14px 16px}
.mcity{display:none}
@media (max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.side{width:360px}}
@media (max-width:900px){
  .top{padding:0 12px;gap:8px;height:auto;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.upd,.vr{display:none}.seg{order:5;width:100%}.seg button{flex:1}
  .wrap{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.pcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .th{display:none}.tr{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding:8px 0}.tr>div{padding:0 12px}
  .tr .c-city{display:none}.mcity{display:block;color:var(--muted);font-family:Inter,sans-serif;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
  .tr .c-note{grid-column:1}.tr .c-pend{grid-column:2;grid-row:1}.tr .c-ans{grid-column:2;grid-row:2;text-align:right}
  .fth{display:none}.ftr{grid-template-columns:minmax(0,1fr) auto;padding:8px 0;row-gap:2px}.ftr>div{padding:0 12px}.ftr .f-city,.ftr .f-closed{display:none}.ftr .f-res{grid-column:2;grid-row:1;text-align:right}
  .dth{display:none}.dtr{grid-template-columns:1fr auto;height:auto;padding:10px 0}.dtr .dx{display:none}.dtr .dm{display:block!important}
  .side{position:fixed;inset:0;width:auto;max-height:none;border-radius:0;border:0;z-index:40;display:none}.side.open{display:flex}.back{display:inline}
}
.dm{display:none;font-size:12.5px;color:var(--muted);grid-column:1/-1}

/* Desktop: dense like a spreadsheet (user 2026-11-14: courier staff are used to Excel size); phones keep the larger touch sizes */
@media (min-width:901px){
  html,body{font-size:13px}
  .top{height:46px;padding:0 16px;gap:10px}.logo{width:26px;height:26px;border-radius:7px;font-size:11px}.ttl b{font-size:13.5px}.ttl small{font-size:11px}
  .seg{padding:2px}.seg button{height:26px;padding:0 11px;font-size:12px}.upd{font-size:11.5px}.rf{width:28px;height:28px}
  .wrap{padding:10px 16px 16px}
  .cards{gap:6px;margin-bottom:8px}.kc{padding:5px 10px;border-radius:8px}.kc .l{font-size:12px}.kc .n b{font-size:16px}.kc .n span{font-size:11px}.kc .s{font-size:10.5px}
  .main{gap:10px}.box{border-radius:8px}
  .tools{padding:6px 10px;gap:6px}.tools input,.tools select{height:28px;font-size:12.5px;padding:0 8px;border-radius:6px}.tools input{width:200px}.tools select{width:150px}
  .fl button{height:24px;padding:0 9px;font-size:11.5px}
  .th,.tr{grid-template-columns:128px 110px minmax(0,1fr) 62px 96px}
  .th{font-size:11px}.th div{padding:5px 6px}.th div:first-child{padding-left:10px}
  .tr{min-height:30px}.tr>div{padding:0 6px}.tr>div:first-child{padding-left:10px}
  .cn{font-size:12px}.city,.note{font-size:12.5px}.again,.upd-t{font-size:10px;padding:0 5px}
  .pend{min-width:48px;font-size:11px;padding:1px 6px}.rp{min-width:64px;font-size:11.5px;padding:2px 0;border-radius:5px}.done-a{font-size:12px}
  .sh{padding:4px 10px;font-size:12px}.sh small{font-size:11.5px}.dot{width:7px;height:7px}
  .more{height:28px;padding:0 10px;font-size:12px}.more .ck{width:16px;height:16px}
  .side{width:340px;top:56px;max-height:calc(100vh - 68px);border-radius:8px}
  .ph{padding:8px 12px}.ph .big{font-size:14px}.cp{height:22px;font-size:11px;padding:0 6px}.ph .r2{font-size:12px;margin-top:2px}
  .pb{padding:8px 12px;gap:9px}.lb{font-size:10px}.tx{font-size:12.5px;margin-top:1px}
  .tl .c{font-size:12px;padding-bottom:5px}.tl .c small{font-size:10.5px}.tl .d{width:7px;height:7px}
  .ag{gap:5px;margin-top:5px}.ag button{min-height:30px;font-size:12px;border-radius:7px;padding:2px 6px}
  textarea{min-height:40px;font-size:12.5px;padding:5px 8px;margin-top:5px}
  .now,.ro{font-size:12px;padding:6px 9px}
  .pn{padding:6px 12px 0}.pn label{font-size:11.5px}.pn input{height:26px;font-size:12px}
  .pf{padding:6px 12px 10px;gap:6px}.btn{height:30px;font-size:12.5px;padding:0 10px;border-radius:6px}
  .dh{padding:4px 10px}.dh b,.dh small,.dh .sum{font-size:12px}
  .fth,.ftr{grid-template-columns:128px 100px 110px minmax(0,1fr) 170px 70px}.res{font-size:12px}
  .pcards{gap:8px;margin:10px 0}.pc{padding:8px 12px}.pc .l{font-size:12px}.pc b{font-size:20px}.pc small{font-size:11px}
  .dth,.dtr{grid-template-columns:150px repeat(6,minmax(0,1fr)) 90px 30px}.dth{font-size:11px}.dth div{padding:6px}.dtr{height:32px;font-size:12.5px}
  .foot{padding:6px 12px;font-size:11.5px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo" id="logo">··</div>
  <div class="ttl"><b id="ttl">Courier queries</b><small id="sub"></small></div>
  <div class="sp"></div>
  <div class="seg" id="seg" hidden><button data-view="q" class="on">Queries</button><button data-view="f">Finished</button><button data-view="p">Performance</button></div>
  <div class="vr"></div>
  <div class="upd" id="upd"></div>
  <button class="rf" id="rf" aria-label="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></button>
</header>
<main class="wrap" id="wrap"><div class="pick">Loading…</div></main>
<input id="cam" type="file" accept="image/*" hidden>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyqtyrClenCG1_iqTSDK5KhtFItfX6rUsYdIexwQ3qPFbSv9d1n8jy06ItjvWXXtB-I/exec', P = new URLSearchParams(location.search), C = P.get('c') || '', V = P.get('v') || '', S = P.get('s') || '';
  var D = null, VIEW = 'q', SEL = '', FOCUS = false, PICK = {}, SHOWN = {}, Q = '', CITY = '', FQ = '', FCITY = '', FCAT = 'all', FDAY = '', PER = 7, busy = false;
  var NK = 'cp_name_' + C, $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
  function post(fn, args, ok, bad) {
    var x = new XMLHttpRequest(); x.open('POST', API); x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    x.onload = function () { var j = null; try { j = JSON.parse(x.responseText); } catch (er) {} if (j && j.ok) ok(j.data); else bad((j && j.error) || 'Something went wrong. Try again.'); };
    x.onerror = function () { bad('No internet. Check the connection and try again.'); };
    x.send(JSON.stringify({ fn: fn, args: args }));
  }
  var CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CHEV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  function kindOf(k) { return D.kinds.filter(function (x) { return x.key === k; })[0]; }
  function answered(x) { return !!(x.status || x.reply) && !x.reopen; } // a request the store changed after the answer needs an answer again
  function pendCls(h) { return h >= 48 ? ' r' : h >= 24 ? ' a' : ''; }
  function pendTxt(h) { return h < 1 ? 'new' : h < 48 ? h + ' h' : Math.floor(h / 24) + ' days'; }
  function dayName(d) {
    if (d === D.today) return 'Today';
    var t = new Date(D.today + 'T00:00:00'), x = new Date(d + 'T00:00:00'), diff = Math.round((t - x) / 86400000);
    var nice = x.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    return diff === 1 ? 'Yesterday · ' + nice : nice;
  }
  function match(x, q, city) { return (!city || (x.city || '—') === city) && (!q || (x.cn + ' ' + x.city).toLowerCase().indexOf(q.toLowerCase().trim()) !== -1); }
  function cityOpts(list, cur) {
    var m = {}; list.forEach(function (x) { var c = x.city || '—'; m[c] = (m[c] || 0) + 1; });
    return '<option value="">All cities</option>' + Object.keys(m).sort().map(function (c) { return '<option' + (c === cur ? ' selected' : '') + ' value="' + esc(c) + '">' + esc(c) + ' (' + m[c] + ')</option>'; }).join('');
  }

  // ---------- data ----------
  function load(quiet) {
    if (busy) return; busy = true; $('rf').classList.add('spin');
    post('appCpData', [C, V, S], function (d) {
      busy = false; $('rf').classList.remove('spin'); D = d; ls('cp_snap_' + C, JSON.stringify(d));
      if (SEL && !find(SEL)) SEL = '';
      head(); render();
    }, function (m) { busy = false; $('rf').classList.remove('spin'); if (!D) $('wrap').innerHTML = '<div class="err">' + esc(m) + '</div>'; else if (!quiet) toast(m); });
  }
  function find(id) { return D.open.filter(function (x) { return x.id === id; })[0] || D.done.filter(function (x) { return x.id === id; })[0]; }
  function head() {
    $('logo').textContent = D.store.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    $('ttl').textContent = D.courier + ' queries'; $('sub').textContent = 'from ' + D.store; $('upd').textContent = 'Updated ' + D.at;
    document.title = D.courier + ' queries · ' + D.store; $('seg').hidden = false;
    Array.prototype.forEach.call($('seg').children, function (b) { b.classList.toggle('on', b.dataset.view === VIEW); });
  }
  function render() { if (!D) return; head(); if (VIEW === 'q') renderQ(); else if (VIEW === 'f') renderF(); else renderP(); }

  // ---------- Queries ----------
  function renderQ() {
    var cards = D.kinds.map(function (k) {
      var all = D.open.filter(function (x) { return x.kind === k.key; }), left = all.filter(function (x) { return !answered(x); }).length, tot = all.length;
      var st = !tot ? 'none' : !left ? 'ok' : left >= 3 ? 'bad' : 'warn', sel = SEL && (find(SEL) || {}).kind === k.key;
      return '<button class="kc' + (st === 'none' ? ' none' : '') + (sel ? ' on' : '') + '" data-jump="' + k.key + '"><div class="l">' + esc(k.label) + '</div>' +
        '<div class="n c-' + st + '"><b>' + (st === 'ok' ? '✓' : left) + '</b><span>' + (st === 'ok' ? 'all done' : st === 'none' ? '' : 'left') + '</span></div>' +
        '<div class="s">' + (tot ? (tot - left) + ' of ' + tot + ' done' : 'nothing today') + '</div></button>';
    }).join('');
    var list = D.open.filter(function (x) { return match(x, Q, CITY); }), body = '';
    D.kinds.forEach(function (k) {
      var all = list.filter(function (x) { return x.kind === k.key; }); if (!all.length) return;
      var todo = all.filter(function (x) { return !answered(x); }), did = all.filter(answered);
      body += '<div class="sh" id="sec_' + k.key + '"><span class="dot" style="background:' + (todo.length ? (todo.length >= 3 ? '#DC2626' : '#D97706') : '#16A34A') + '"></span><b>' + esc(k.label) + '</b><small>' +
        (todo.length ? todo.length + ' left' + (did.length ? ' · ' + did.length + ' answered' : '') : 'all answered ✓') + '</small></div>';
      body += todo.map(row).join('');
      if (did.length) {
        body += '<button class="more" data-more="' + k.key + '"><span class="ck">' + CHECK + '</span><span>' + did.length + ' answered</span><span style="color:var(--line)">·</span><em>' + (SHOWN[k.key] ? 'Hide' : 'Show') + '</em>' + CHEV + '</button>';
        if (SHOWN[k.key]) body += did.map(row).join('');
      }
    });
    var html = '<div class="cards">' + cards + '</div><div class="main"><div class="box"><div class="tools"><input id="q" type="search" placeholder="Search tracking ID" value="' + esc(Q) + '"><select id="city">' + cityOpts(D.open, CITY) + '</select></div>' +
      '<div class="th"><div>Tracking ID</div><div>City</div><div>Note</div><div>Pending</div><div>Your answer</div></div>' +
      (body || '<div class="empty">' + (D.open.length ? 'Nothing matches the search.' : 'No open queries. Shukriya!') + '</div>') + '</div>' + side(true) + '</div>';
    $('wrap').innerHTML = html; wireQ();
  }
  function row(x) {
    return '<div class="tr' + (x.id === SEL ? ' sel' : '') + (answered(x) ? ' ans' : '') + '" data-open="' + esc(x.id) + '">' +
      '<div class="cn">' + esc(x.cn) + '<span class="mcity">' + esc(x.city) + '</span></div><div class="city c-city" title="' + esc(x.city) + '">' + esc(x.city) + '</div>' +
      '<div class="note c-note">' + (x.again ? '<i class="again">' + esc(x.again) + '</i>' : '') + (x.updated && !answered(x) ? '<i class="upd-t">Updated</i>' : '') + '<span>' + esc(x.note) + '</span></div>' +
      '<div class="c-pend"><span class="pend' + (answered(x) ? '' : pendCls(x.hours)) + '">' + pendTxt(x.hours) + '</span></div>' +
      '<div class="c-ans">' + (answered(x) ? '<span class="done-a">✓ ' + esc(x.status || 'Answered') + '</span>' : '<span class="rp" data-reply="' + esc(x.id) + '">Reply ›</span>') + '</div></div>';
  }
  function timeline(h) {
    if (!h || !h.length) return '';
    return '<div><div class="lb" style="margin-bottom:6px">Parcel history</div>' + h.map(function (e, i) {
      return '<div class="tl"><div class="rail"><div class="d k-' + e.k + '"></div>' + (i < h.length - 1 ? '<div class="ln"></div>' : '') + '</div><div class="c">' +
        (e.who ? '<span class="w-' + e.k + '">' + esc(e.who) + '</span> ' : '') + esc(e.what) + '<small>' + esc(e.when) + '</small></div></div>';
    }).join('') + '</div>';
  }
  function side(editable) {
    var x = SEL && find(SEL);
    if (!x) return '<aside class="side" id="side"><div class="pick">Click a parcel to see its details and reply.</div></aside>';
    var k = kindOf(x.kind), pick = PICK[x.id] != null ? PICK[x.id] : x.status, isOpen = editable && D.open.indexOf(x) !== -1;
    var h = '<aside class="side open" id="side"><div class="ph"><div class="r1"><button class="back" data-close aria-label="Back">‹</button><div class="big">' + esc(x.cn) + '</div><button class="cp" data-copy="' + esc(x.cn) + '">Copy</button><div class="sp"></div>' +
      (isOpen ? '<span class="pend' + (answered(x) ? '' : pendCls(x.hours)) + '">' + pendTxt(x.hours) + '</span>' : '<span class="res ' + resCls(x.cat) + '">' + esc(x.result) + '</span>') + '</div>' +
      '<div class="r2">' + esc(x.city || 'City not given') + (isOpen ? '' : ' · ' + esc(k.label)) + (x.again ? ' <i class="again">' + esc(x.again) + '</i>' : '') + '</div></div><div class="pb">';
    if (x.says) h += '<div><div class="lb">' + (x.kind === 'claim' ? 'Claim' : 'Customer remarks') + '</div><div class="tx">' + esc(x.says) + '</div></div>';
    if (x.ask) h += '<div><div class="lb">Our request</div><div class="tx">' + esc(x.ask) + '</div></div>';
    h += timeline(x.history);
    if (isOpen) {
      if (x.reopen) h += '<div class="ro" style="color:var(--ink2)"><b>Updated ' + esc(x.updated) + '</b> · the customer told ' + esc(D.store) + ' something new after your last answer (' + esc([x.status, x.reply].filter(Boolean).join(' · ')) + '). Please answer again.</div>';
      if (answered(x)) h += '<div class="now"><b>' + esc(x.status || 'Your answer') + '</b>' + (x.reply ? ' · ' + esc(x.reply) : '') + '<small>' + esc([x.by, x.at].filter(Boolean).join(' · ')) + (x.photos ? ' · ' + x.photos + ' photo' + (x.photos > 1 ? 's' : '') : '') + '</small></div>';
      h += '<div id="ansBox"><div class="lb">' + (answered(x) ? 'Change your answer' : 'Your answer · one tap') + '</div><div class="ag">' + k.answers.map(function (a) {
        return '<button class="' + (a === pick ? 'on' : '') + '" data-ans="' + esc(a) + '">' + esc(a) + '</button>'; }).join('') + '</div>' +
        '<textarea id="words" maxlength="500" placeholder="Or write your answer (Roman Urdu theek hai)">' + esc(PICK['w' + x.id] != null ? PICK['w' + x.id] : x.reply) + '</textarea></div>';
      h += '</div><div class="pn"><label for="who">Your name</label><input id="who" maxlength="40" placeholder="optional" value="' + esc(ls(NK)) + '"></div>' +
        '<div class="pf"><button class="btn" id="photo">Add photo</button><button class="btn pri" id="save">Save &amp; next</button></div></aside>';
    } else h += '<div class="ro">Finished queries are read only. If ' + esc(D.store) + ' sends it again, it comes back to Queries with this history.</div></div></aside>';
    return h;
  }
  function wireQ() {
    var q = $('q'); if (q) q.oninput = function () { Q = q.value; renderQ(); var n = $('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    if ($('city')) $('city').onchange = function () { CITY = this.value; renderQ(); };
    if ($('who')) $('who').onchange = function () { ls(NK, this.value.trim()); };
    if ($('words')) { $('words').oninput = function () { PICK['w' + SEL] = this.value; }; if (FOCUS) { $('words').focus(); FOCUS = false; } }
    if ($('save')) $('save').onclick = save;
    if ($('photo')) $('photo').onclick = function () { $('cam').value = ''; $('cam').click(); };
  }
  function nextOpen(after) {
    var order = D.open.filter(function (x) { return !answered(x) && match(x, Q, CITY); });
    var i = order.map(function (x) { return x.id; }).indexOf(after);
    return (order[i + 1] || order.filter(function (x) { return x.id !== after; })[0] || {}).id || '';
  }
  function save() {
    var x = find(SEL); if (!x) return;
    var st = PICK[x.id] != null ? PICK[x.id] : x.status, w = ($('words').value || '').trim(), who = ($('who').value || '').trim();
    if (!st && !w) { toast('Tap an answer or write one'); return; }
    ls(NK, who);
    var b = $('save'); b.disabled = true; b.textContent = 'Saving…';
    post('appCpReply', [C, V, S, x.id, st || '', w, who], function (r) {
      x.status = st || ''; x.reply = w; x.by = who || D.courier; x.at = r.at; delete PICK[x.id]; delete PICK['w' + x.id];
      toast('Saved · ' + D.store + ' can see it now'); SEL = nextOpen(x.id); render();
      if (window.innerWidth <= 900 && !SEL) closeSide();
    }, function (m) { b.disabled = false; b.textContent = 'Save & next'; toast(m); });
  }
  function closeSide() { SEL = ''; render(); }

  // ---------- Finished ----------
  function resCls(cat) { return cat === 'ulta' ? 'bad' : cat === 'failed' || cat === 'noaction' ? 'warn' : cat === 'done' ? 'mute' : ''; }
  function renderF() {
    var cats = [['all', 'All'], ['delivered', 'Delivered'], ['ulta', 'Returned instead'], ['noaction', 'No action']];
    var list = D.done.filter(function (x) { return match(x, FQ, FCITY) && (FCAT === 'all' || x.cat === FCAT) && (!FDAY || x.day === FDAY); });
    var byDay = {}; list.forEach(function (x) { (byDay[x.day] = byDay[x.day] || []).push(x); });
    var body = Object.keys(byDay).sort().reverse().map(function (d) {
      var xs = byDay[d], n = function (c) { return xs.filter(function (x) { return x.cat === c; }).length; }, parts = [];
      if (n('delivered')) parts.push(n('delivered') + ' delivered'); if (n('ulta')) parts.push('<i>' + n('ulta') + ' returned instead</i>');
      if (n('failed')) parts.push(n('failed') + ' failed again'); if (n('noaction')) parts.push(n('noaction') + ' no action');
      return '<div class="dh"><b>' + esc(dayName(d)) + '</b><small>' + xs.length + ' quer' + (xs.length > 1 ? 'ies' : 'y') + '</small><span class="sum">' + parts.join(' · ') + '</span></div>' + xs.map(function (x) {
        return '<div class="tr ftr' + (x.id === SEL ? ' sel' : '') + '" data-open="' + esc(x.id) + '"><div class="cn">' + esc(x.cn) + '<span class="mcity">' + esc(x.city) + '</span></div><div class="city f-city" title="' + esc(x.city) + '">' + esc(x.city) + '</div>' +
          '<div style="font-size:13px;color:var(--muted)">' + esc(kindOf(x.kind).label) + '</div><div style="font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc([x.status, x.reply].filter(Boolean).join(' · ') || '— no answer') + '</div>' +
          '<div class="f-res"><span class="res ' + resCls(x.cat) + '">' + esc(x.result) + '</span></div><div class="f-closed" style="font-size:12.5px;color:var(--muted)">' + esc(x.closedAt) + '</div></div>';
      }).join('');
    }).join('');
    $('wrap').innerHTML = '<div class="main"><div class="box"><div class="tools"><input id="fq" type="search" placeholder="Search tracking ID" value="' + esc(FQ) + '"><select id="fcity">' + cityOpts(D.done, FCITY) + '</select>' +
      '<div class="fl">' + cats.map(function (c) { return '<button class="' + (FCAT === c[0] ? 'on' : '') + '" data-fcat="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>' +
      (FDAY ? '<div class="fl"><button class="on" data-fday="">' + esc(dayName(FDAY)) + ' ✕</button></div>' : '') + '<span class="hint">Last 14 days</span></div>' +
      '<div class="th fth"><div>Tracking ID</div><div>City</div><div>Query</div><div>Your answer</div><div>Result</div><div>Closed</div></div>' +
      (body || '<div class="empty">Nothing finished here yet.</div>') + '</div>' + side(false) + '</div>';
    var fq = $('fq'); fq.oninput = function () { FQ = fq.value; renderF(); var n = $('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    $('fcity').onchange = function () { FCITY = this.value; renderF(); };
  }

  // ---------- Performance ----------
  function renderP() {
    var from = PER === 'm' ? D.today.slice(0, 8) + '01' : (function () { var t = new Date(D.today + 'T00:00:00'); t.setDate(t.getDate() - (PER - 1)); return t.toISOString().slice(0, 10); })();
    var days = D.days.filter(function (d) { return d.day >= from; }), sum = function (k) { return days.reduce(function (a, d) { return a + d[k]; }, 0); };
    var reFin = sum('reFin'), reDel = sum('reDel'), actBase = sum('actBase'), acted = sum('acted');
    var hrs = [].concat.apply([], days.map(function (d) { return d.replyH; })).sort(function (a, b) { return a - b; });
    var med = hrs.length ? hrs[Math.floor(hrs.length / 2)] : null;
    var card = function (l, v, s, bad) { return '<div class="pc"><div class="l">' + l + '</div><b' + (bad ? ' class="bad"' : '') + '>' + v + '</b><small>' + s + '</small></div>'; };
    var cards = card('Delivered after reattempt', reFin ? Math.round(reDel / reFin * 100) + '%' : '—', reFin ? reDel + ' of ' + reFin + ' reattempts' : 'no finished reattempts yet') +
      card('Returned instead', sum('ulta'), 'asked to deliver, it went back', sum('ulta') > 0) +
      card('Acted within 24 hours', actBase ? Math.round(acted / actBase * 100) + '%' : '—', 'a scan or an answer after the query') +
      card('Usual reply time', med == null ? '—' : (med < 1 ? '<1' : Math.round(med)) + ' h', 'half the answers come within this');
    var z = function (n, cls) { return '<div class="dx ' + (n ? cls : 'z') + '">' + n + '</div>'; };
    var rows = days.map(function (d) {
      var fin = d.delivered + d.ulta + d.failed, p = fin ? Math.round(d.delivered / fin * 100) : null;
      return '<div class="dtr" data-pday="' + d.day + '"><div>' + esc(dayName(d.day)) + '</div><div class="dx">' + d.sent + '</div><div class="dx">' + d.delivered + '</div>' +
        z(d.ulta, 'bad') + z(d.failed, '') + z(d.noaction, 'warn') + '<div class="dx mute">' + d.open + '</div>' +
        '<div class="dx"' + (p != null && p < 50 ? ' style="color:var(--red);font-weight:600"' : ' style="font-weight:600"') + '>' + (p == null ? '—' : p + '%') + '</div><div class="dx" style="color:var(--faint)">›</div>' +
        '<div class="dm">' + d.sent + ' queries · ' + d.delivered + ' delivered' + (d.ulta ? ' · <b style="color:var(--red)">' + d.ulta + ' returned instead</b>' : '') + (d.noaction ? ' · ' + d.noaction + ' no action' : '') + '</div></div>';
    }).join('');
    var per = [[7, 'Last 7 days'], [30, 'Last 30 days'], ['m', 'This month']];
    $('wrap').innerHTML = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="seg">' + per.map(function (p) { return '<button data-per="' + p[0] + '" class="' + (String(PER) === String(p[0]) ? 'on' : '') + '">' + p[1] + '</button>'; }).join('') + '</div>' +
      '<span style="font-size:13px;color:var(--muted)">by the day ' + esc(D.store) + ' sent the query</span></div><div class="pcards">' + cards + '</div>' +
      '<div class="box"><div class="dth"><div>Day</div><div>Queries</div><div>Delivered</div><div>Returned instead</div><div>Failed again</div><div>No action 24 h</div><div>Still open</div><div>Delivered %</div><div></div></div>' +
      (rows || '<div class="empty">No queries in these days.</div>') + '<div class="foot">Click a day to see its parcels in Finished.</div></div>';
  }

  // ---------- clicks ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button,[data-open],[data-pday]'); if (!t || !D) return;
    if (t.dataset.view) { VIEW = t.dataset.view; SEL = ''; render(); window.scrollTo(0, 0); }
    else if (t.dataset.jump) { var el = $('sec_' + t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (t.dataset.more) { SHOWN[t.dataset.more] = !SHOWN[t.dataset.more]; renderQ(); }
    else if (t.dataset.ans) { var a = t.dataset.ans, x = find(SEL), cur = PICK[SEL] != null ? PICK[SEL] : x.status; PICK[SEL] = cur === a ? '' : a; renderQ(); }
    else if (t.dataset.copy) { try { navigator.clipboard.writeText(t.dataset.copy); toast('Tracking ID copied'); } catch (er) {} }
    else if (t.hasAttribute('data-close')) closeSide();
    else if (t.dataset.fcat) { FCAT = t.dataset.fcat; renderF(); }
    else if (t.dataset.fday !== undefined && t.tagName === 'BUTTON') { FDAY = ''; renderF(); }
    else if (t.dataset.per) { PER = t.dataset.per === 'm' ? 'm' : Number(t.dataset.per); renderP(); }
    else if (t.dataset.pday) { FDAY = t.dataset.pday; FCAT = 'all'; VIEW = 'f'; SEL = ''; render(); window.scrollTo(0, 0); }
    else if (t.dataset.open) { SEL = t.dataset.open; FOCUS = !!e.target.closest('[data-reply]'); render(); if (FOCUS && $('ansBox')) $('ansBox').scrollIntoView({ block: 'nearest' }); }
  });
  $('rf').onclick = function () { load(false); };
  $('cam').onchange = function () {
    var f = this.files && this.files[0], id = SEL; if (!f || !id) return;
    toast('Uploading photo…');
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      post('appCpPhoto', [C, V, S, id, c.toDataURL('image/jpeg', 0.8), ls(NK)], function () { var x = find(id); if (x) x.photos++; toast('Photo uploaded'); render(); }, toast);
    };
    img.onerror = function () { toast('This file is not a photo'); };
    img.src = url;
  };
  // fresh data every 2 minutes while the page is open and nobody is typing
  setInterval(function () { if (document.visibilityState === 'visible' && !(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) load(true); }, 120000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(true); });

  if (!C || !V || !S) { $('wrap').innerHTML = '<div class="err">This link is not complete. Ask the store for the link again.</div>'; return; }
  try { var sn = JSON.parse(ls('cp_snap_' + C) || 'null'); if (sn && sn.courier === C && sn.kinds) { D = sn; render(); } } catch (er) {}
  load(false);
})();
</script>
</body>
</html>
