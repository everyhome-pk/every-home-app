      '<div class="warn"><b>' + cnt('failed') + '</b>attempt failed</div><div><b>' + cnt('noaction') + '</b>no action</div></div>' : '';
    var byDay = {}; list.forEach(function (x) { (byDay[x.day] = byDay[x.day] || []).push(x); });
    ORDER = [];
    var body = Object.keys(byDay).sort().reverse().map(function (d) {
      var xs = byDay[d]; xs.forEach(function (x) { ORDER.push(x.id); }); var n = function (c) { return xs.filter(function (x) { return x.cat === c; }).length; }, parts = [];
      if (n('delivered')) parts.push(n('delivered') + ' delivered'); if (n('ulta')) parts.push('<i>' + n('ulta') + ' returned instead</i>');
      if (n('failed')) parts.push(n('failed') + ' reattempt failed'); if (n('noaction')) parts.push(n('noaction') + ' no action');
      return '<div class="dh"><b>' + esc(dayName(d)) + '</b><small>' + xs.length + ' quer' + (xs.length > 1 ? 'ies' : 'y') + '</small><span class="sum">' + parts.join(' · ') + '</span></div>' + xs.map(function (x) {
        return '<div class="tr ftr' + (x.id === SEL ? ' sel' : '') + '" data-open="' + esc(x.id) + '"><div class="cn">' + esc(x.cn) + cpyBtn(x.cn) + '<span class="mcity">' + esc(x.city) + '</span></div><div class="city f-city" title="' + esc(x.city) + '">' + esc(x.city) + '</div>' +
          '<div style="font-size:13px;color:var(--muted);white-space:nowrap">' + esc(kindShort(x.kind)) + '</div><div class="f-resp" style="font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc([x.status, x.reply].filter(Boolean).join(' · ') || '— no answer') + (x.by || x.at ? '<small>' + esc([x.by, shortDay(x.at)].filter(Boolean).join(' · ')) + '</small>' : '') + '</div>' +
          '<div class="f-res"><span class="res ' + resCls(x.cat) + '">' + esc(x.result) + '</span></div><div class="f-closed" style="font-size:12.5px;color:var(--muted)">' + esc(x.closedAt) + '</div></div>';
      }).join('');
    }).join('');
    $('wrap').innerHTML = '<div class="box"><div class="tools"><input id="fq" type="search" placeholder="Search tracking ID" value="' + esc(FQ) + '"><select id="fcity">' + cityOpts(D.done, FCITY) + '</select>' +
      '<div class="fl">' + cats.filter(function (c) { return c[0] === 'all' || cnt(c[0]) || FCAT === c[0]; }).map(function (c) { return '<button class="' + (FCAT === c[0] ? 'on' : '') + '" data-fcat="' + c[0] + '">' + c[1] + '<i>' + cnt(c[0]) + '</i></button>'; }).join('') + '</div>' +
      (FDAY ? '<div class="fl"><button class="on" data-fday="">' + esc(dayName(FDAY)) + ' ✕</button></div>' : '') + '<span class="hint">Last 14 days</span></div>' + fsum +
      '<div class="th fth"><div>Tracking ID</div><div>City</div><div>Request Type</div><div>Response</div><div>Outcome</div><div>Closed On</div></div>' +
      (body || '<div class="empty">No resolved queries yet.</div>') + '</div>' + popup(false);
    document.body.classList.toggle('mdl-on', !!(SEL && find(SEL)));
    var fq = $('fq'); fq.oninput = function () { FQ = fq.value; renderF(); var n = $('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    $('fcity').onchange = function () { FCITY = this.value; renderF(); };
  }

  // ---------- Performance ----------
  function renderP() {
    // whole days in UTC: a local midnight turned into UTC fell a day back in Pakistan (+5) and the day loop never ended
    var dAdd = function (d, n) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
    var from, to = D.today, pFrom, pTo;
    if (PER === 'm') { from = D.today.slice(0, 8) + '01'; pTo = dAdd(from, -1); pFrom = pTo.slice(0, 8) + '01'; }
    else { from = dAdd(D.today, -(PER - 1)); pTo = dAdd(from, -1); pFrom = dAdd(pTo, -(PER - 1)); }
    var inR = function (f, t) { return D.days.filter(function (d) { return d.day >= f && d.day <= t; }); };
    var days = inR(from, to), prev = inR(pFrom, pTo);
    // the four numbers of a period (also for the period before, to compare)
    var mOf = function (ds) {
      var sm = function (k) { return ds.reduce(function (a, d) { return a + d[k]; }, 0); };
      var hrs = [].concat.apply([], ds.map(function (d) { return d.replyH; })).sort(function (a, b) { return a - b; });
      return { succ: sm('reFin') ? Math.round(sm('reDel') / sm('reFin') * 100) : null, reFin: sm('reFin'), reDel: sm('reDel'), ulta: sm('ulta'),
        act: sm('actBase') ? Math.round(sm('acted') / sm('actBase') * 100) : null, med: hrs.length ? hrs[Math.floor(hrs.length / 2)] : null, n: sm('sent') };
    };
    var M = mOf(days), Pm = mOf(prev), hasPrev = Pm.n > 0;
    var medTxt = function (h) { return h < 1 ? Math.max(1, Math.round(h * 60)) + ' min' : Math.round(h) + ' h'; };
    // colour by meaning (user 2026-11-18): good green, watch amber, bad red; no colour when there is nothing to judge
    var tone = function (v, good, ok, lowGood) { if (v == null) return ''; return lowGood ? (v <= good ? 'g' : v <= ok ? 'a' : 'r') : (v >= good ? 'g' : v >= ok ? 'a' : 'r'); };
    var chg = function (v, p, unit, lowGood) {
      if (!hasPrev || v == null || p == null || v === p) return hasPrev && v != null && p != null ? '<span class="cmp">same as before</span>' : '';
      var up = v > p, good = lowGood ? !up : up, dd = Math.abs(v - p);
      return '<span class="cmp ' + (good ? 'g' : 'r') + '">' + (up ? '▲ ' : '▼ ') + (unit === 'h' ? medTxt(dd) : dd + unit) + ' vs previous</span>';
    };
    var card = function (l, v, s, t, c) { return '<div class="pc ' + (t ? 't-' + t : '') + '"><div class="l">' + l + '</div><b>' + v + '</b><small>' + s + '</small>' + (c || '') + '</div>'; };
    var cards = card('Reattempt Success Rate', M.succ == null ? 'No result yet' : M.succ + '%', M.succ == null ? 'no reattempt finished in this period' : M.reDel + ' of ' + M.reFin + ' reattempts delivered', tone(M.succ, 60, 40), chg(M.succ, Pm.succ, ' pts')) +
      card('Returned (RTO)', M.ulta, M.ulta ? 'reattempt requested, shipment returned' : 'no reattempt was returned', M.ulta ? 'r' : (M.reFin ? 'g' : ''), chg(M.ulta, Pm.ulta, '', true)) +
      card('24-Hour Action Rate', M.act == null ? 'No requests yet' : M.act + '%', 'a scan or a response within 24 h of the request', tone(M.act, 80, 50), chg(M.act, Pm.act, ' pts')) +
      card('Median Response Time', M.med == null ? 'No responses yet' : medTxt(M.med), M.med == null ? 'answer a query to start' : 'half of all responses arrive within this', tone(M.med, 6, 24, true), chg(M.med, Pm.med, 'h', true));
    // a small daily chart: delivered (green), returned (red), failed (amber), still open / other (grey) per request day
    // every day of the period, also the empty ones, so the chart reads as a timeline
    var byD = {}; days.forEach(function (d) { byD[d.day] = d; }), cdays = [];
    for (var cd = from, guard = 0; cd <= to && guard < 62; cd = dAdd(cd, 1), guard++) cdays.push(byD[cd] || { day: cd, sent: 0, delivered: 0, ulta: 0, failed: 0 });
    var maxN = Math.max.apply(null, days.map(function (d) { return d.sent; }).concat([1]));
    var chart = days.length ? '<div class="box pchart"><div class="pch-h"><b>Requests by day</b><span><i class="g"></i>Delivered<i class="r"></i>Returned<i class="a"></i>Failed<i></i>Open / other</span></div><div class="pch">' +
      cdays.map(function (d) {
        var rest = Math.max(0, d.sent - d.delivered - d.ulta - d.failed), hp = function (n) { return (n / maxN * 100).toFixed(1) + '%'; };
        return '<div class="pcol" data-pday="' + d.day + '" title="' + esc(dayName(d.day)) + ': ' + d.sent + ' requests · ' + d.delivered + ' delivered · ' + d.ulta + ' returned · ' + d.failed + ' failed"><div class="pst">' +
          '<i style="height:' + hp(rest) + '"></i><i class="a" style="height:' + hp(d.failed) + '"></i><i class="r" style="height:' + hp(d.ulta) + '"></i><i class="g" style="height:' + hp(d.delivered) + '"></i></div><small>' + esc(d.day.slice(8)) + '</small></div>';
      }).join('') + '</div></div>' : '';
    var z = function (n, cls) { return '<div class="dx ' + (n ? cls : 'z') + '">' + (n || '–') + '</div>'; };
    var rows = days.map(function (d) {
      var fin = d.delivered + d.ulta + d.failed, p = fin ? Math.round(d.delivered / fin * 100) : null;
      return '<div class="dtr" data-pday="' + d.day + '"><div class="dday" title="' + esc(dayName(d.day)) + '">' + esc(dayName(d.day)) + '</div><div class="dx">' + d.sent + '</div><div class="dx">' + (d.delivered || '–') + '</div>' +
        z(d.ulta, 'bad') + z(d.failed, 'warn') + z(d.noaction, 'warn') + '<div class="dx mute">' + (d.open || '–') + '</div>' +
        '<div class="dx drate">' + (p == null ? '<span class="mute">—</span>' : '<span class="rb"><i class="' + (p >= 60 ? 'g' : p >= 40 ? 'a' : 'r') + '" style="width:' + p + '%"></i></span>' + p + '%') + '</div><div class="dx" style="color:var(--faint)">›</div>' +
        '<div class="dm">' + d.sent + ' queries · ' + d.delivered + ' delivered' + (d.ulta ? ' · <b>' + d.ulta + ' returned (RTO)</b>' : '') + (d.noaction ? ' · ' + d.noaction + ' no action' : '') + '</div></div>';
    }).join('');
    var per = [[7, 'Last 7 days'], [30, 'Last 30 days'], ['m', 'This month']];
    $('wrap').innerHTML = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="seg">' + per.map(function (p) { return '<button data-per="' + p[0] + '" class="' + (String(PER) === String(p[0]) ? 'on' : '') + '">' + p[1] + '</button>'; }).join('') + '</div>' +
      '<span style="font-size:13px;color:var(--muted)">by request date' + (hasPrev ? ' · compared with the ' + (PER === 'm' ? 'month' : PER + ' days') + ' before' : '') + '</span></div><div class="pcards">' + cards + '</div>' + chart +
      '<div class="box"><div class="dth"><div>Date</div><div>Requests</div><div>Delivered</div><div>Returned (RTO)</div><div>Reattempt Failed</div><div>No Action (24 h)</div><div>Open</div><div>Delivery Rate</div><div></div></div>' +
      (rows || '<div class="empty">No requests in this period.</div>') + '<div class="foot">Select a date to view its shipments under Resolved.</div></div>';
  }

  // ---------- clicks ----------
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-bk]')) { var bk = e.target.closest('[data-bk]').getAttribute('data-bk'); if (e.target.checked) BULK[bk] = 1; else delete BULK[bk]; renderQ(); return; }
    if (QOPEN && !e.target.closest('.qm')) { QOPEN = ''; renderQ(); }
    var t = e.target.closest('button,[data-open],[data-pday]'); if (!t || !D) return;
    if (t.dataset.view) { VIEW = t.dataset.view; SEL = ''; render(); window.scrollTo(0, 0); }
    else if (t.dataset.jump) { KIND = KIND === t.dataset.jump ? '' : t.dataset.jump; FLASH = !!KIND; SEL = ''; renderQ(); }
    else if (t.dataset.ulta) { ls('cp_ulta', ls('cp_ulta') === '1' ? '0' : '1'); renderQ(); }
    else if (t.dataset.all) { ALL = t.dataset.all === '1'; ls('cp_all', ALL ? '1' : '0'); renderQ(); }
    else if (t.dataset.bulkgo) bulkGo(t);
    else if (t.dataset.qmenu) { QOPEN = QOPEN === t.dataset.qmenu ? '' : t.dataset.qmenu; renderQ(); }
    else if (t.dataset.mark) { QOPEN = ''; var mx = find(t.dataset.mark); mark([t.dataset.mark], mx ? kindOf(mx.kind).answers[Number(t.dataset.mi) || 0] : ''); }
    else if (t.dataset.undo) { clearTimeout(PEND[t.dataset.undo]); delete PEND[t.dataset.undo]; delete PANS[t.dataset.undo]; renderQ(); toast('Undone'); }
    else if (t.dataset.moreans) { MORE[t.dataset.moreans] = 1; renderQ(); }
    else if (t.dataset.markall) {
      var ids = D.open.filter(function (x) { return x.kind === 'return' && !answered(x) && !PEND[x.id] && match(x, Q, CITY); }).map(function (x) { return x.id; });
      if (!SURE) { SURE = true; clearTimeout(SURE_T); SURE_T = setTimeout(function () { SURE = false; renderQ(); }, 4000); renderQ(); }
      else { SURE = false; clearTimeout(SURE_T); mark(ids); }
    }
    else if (t.dataset.step) step(Number(t.dataset.step));
    else if (t.dataset.ans) { var a = t.dataset.ans, x = find(SEL), cur = PICK[SEL] != null ? PICK[SEL] : x.status; PICK[SEL] = cur === a ? '' : a; renderQ(); }
    else if (t.dataset.copy) { try { navigator.clipboard.writeText(t.dataset.copy); toast('Tracking ID copied'); } catch (er) {} }
    else if (t.hasAttribute('data-close')) closeSide();
    else if (t.dataset.fcat) { FCAT = t.dataset.fcat; renderF(); }
    else if (t.dataset.fday !== undefined && t.tagName === 'BUTTON') { FDAY = ''; renderF(); }
    else if (t.dataset.per) { PER = t.dataset.per === 'm' ? 'm' : Number(t.dataset.per); renderP(); }
    else if (t.dataset.pday) { FDAY = t.dataset.pday; FCAT = 'all'; VIEW = 'f'; SEL = ''; render(); window.scrollTo(0, 0); }
    else if (t.dataset.open) { SEL = t.dataset.open; FOCUS = !!e.target.closest('[data-reply]'); render(); }
  });
  // keyboard in the pop-up: Esc closes, ↑ ↓ previous / next (not while typing)
  document.addEventListener('keydown', function (e) {
    if (!SEL || !D) return;
    if (e.key === 'Escape') { closeSide(); return; }
    if (document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); step(e.key === 'ArrowDown' ? 1 : -1); }
  });
  $('rf').onclick = function () { load(false); };
  // each area scrolls on its own (user 2026-11-18): the mouse over the chat panel scrolls the chat, never the table behind;
  // anywhere on the panel (header, pinned bar, answer box) the wheel moves the chat; the message box scrolls itself first
  document.addEventListener('wheel', function (e) {
    var m = e.target.closest && e.target.closest('.mdl'); if (!m) return;
    var c = $('cht'), w = e.target.closest('textarea');
    if (w && w.scrollHeight > w.clientHeight && !((e.deltaY < 0 && w.scrollTop <= 0) || (e.deltaY > 0 && w.scrollTop + w.clientHeight >= w.scrollHeight - 1))) return;
    e.preventDefault();
    if (c) c.scrollTop += e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY;
  }, { passive: false });
  $('cam').onchange = function () { var f = this.files && this.files[0]; if (f && SEL) sendPhoto(f, SEL); };
  // Ctrl+V with a screenshot while an open query is shown (text still pastes into the box as usual)
  document.addEventListener('paste', function (e) {
    var x = SEL && find(SEL); if (!x || D.open.indexOf(x) === -1 || !$('drop')) return;
    var it = [].slice.call((e.clipboardData && e.clipboardData.items) || []).filter(function (i) { return /^image\//.test(i.type); })[0];
    if (!it) return;
    e.preventDefault(); sendPhoto(it.getAsFile(), SEL);
  });
  function sendPhoto(f, id) {
    if (!f || !id) return;
    if (!/^image\//.test(f.type || '')) { toast('This file is not a photo'); return; }
    toast('Uploading photo…');
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      post('appCpPhoto', [C, V, S, id, c.toDataURL('image/jpeg', 0.8), ls(NK)], function () { var x = find(id); if (x) x.photos++; toast('Photo uploaded'); render(); }, toast);
    };
    img.onerror = function () { toast('This file is not a photo'); };
    img.src = url;
  };
  // fresh data every 2 minutes while the page is open and nobody is typing
  setInterval(function () { if (document.visibilityState === 'visible' && !(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) load(true); }, 120000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(true); });

  if (!C || !V || !S) { $('wrap').innerHTML = '<div class="err">This link is not complete. Ask the store for the link again.</div>'; return; }
  try { var sn = JSON.parse(ls('cp_snap_' + C) || 'null'); if (sn && sn.courier === C && sn.kinds) { D = sn; render(); } } catch (er) {}
  load(false);
})();
</script>
