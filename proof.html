<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Proof photo</title>
<link rel="icon" href="ordi-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--brand:#00857A;--brand-ink:#FFFFFF;--soft:#E7F5F2;--soft-ink:#00665D;--ok:#DCFCE7;--ok-ink:#166534;--bad:#FEE2E2;--bad-ink:#991B1B}
@media (prefers-color-scheme:dark){:root{--bg:#0A0F1A;--card:#121A2A;--ink:#E6EAF0;--muted:#94A3B8;--line:#1F2A3C;--soft:#12302D;--soft-ink:#3FE0A8;--ok:#0F2A1C;--ok-ink:#4ADE80;--bad:#2A1313;--bad-ink:#FCA5A5}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;flex:1;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--soft-ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.store{font-weight:600;font-size:14px}.cour{margin-left:auto;font-size:12px;color:var(--muted)}
.lbl{margin-top:24px;font-size:12px;color:var(--muted)}.cn{font:500 22px/1.3 'Roboto Mono',ui-monospace,monospace;margin-top:2px;letter-spacing:.3px;word-break:break-all}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.drop{margin-top:18px;border:1.5px dashed var(--line);border-radius:14px;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;overflow:hidden;position:relative}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.drop.has{border:0}
.bar{margin-top:14px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.note{font-size:13px;margin-top:8px;color:var(--muted)}.ok{display:flex;align-items:center;gap:8px;background:var(--ok);color:var(--ok-ink);border-radius:12px;padding:11px 12px;font-size:14px;font-weight:500;margin-top:14px}
.err{background:var(--bad);color:var(--bad-ink);border-radius:12px;padding:11px 12px;font-size:14px;margin-top:14px}
.grow{flex:1;min-height:16px}.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;border:0;font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
.pri{background:var(--brand);color:var(--brand-ink)}.sec{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px;height:46px;font-size:15px}.lnk{background:none;border:0;color:var(--brand);font:500 14px Inter,sans-serif;margin-top:12px;cursor:pointer;width:100%;padding:6px}
.btn:active{transform:scale(.98)}.btn:disabled,.lnk:disabled{opacity:.45;pointer-events:none}[hidden]{display:none!important}svg{flex:none}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="top"><div class="logo" id="logo">EH</div><div class="store" id="store">Loading…</div><div class="cour" id="cour"></div></div>
  <div class="lbl">Proof photo</div>
  <div class="cn" id="cn">—</div>
  <div class="sub" id="sub"></div>
  <div class="drop" id="drop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="hint">Parcel, POD ya location ki tasveer</span></div>
  <div class="bar" id="bar" hidden><i id="barI"></i></div>
  <div class="note" id="note" hidden></div>
  <div class="ok" id="ok" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg><span id="okT"></span></div>
  <div class="err" id="err" hidden></div>
  <div class="grow"></div>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
  <input id="gal" type="file" accept="image/*" hidden>
  <button class="btn pri" id="take" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="takeT">Take photo</span></button>
  <button class="lnk" id="pick" disabled>Choose from gallery</button>
</div><div class="foot" id="foot"></div></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyqtyrClenCG1_iqTSDK5KhtFItfX6rUsYdIexwQ3qPFbSv9d1n8jy06ItjvWXXtB-I/exec', q = new URLSearchParams(location.search), T = q.get('t') || '', E = q.get('e') || '', S = q.get('s') || '', busy = false, done = 0;
  var $ = function (id) { return document.getElementById(id); };
  function show(id, on) { $(id).hidden = !on; }
  function fail(msg) { $('err').textContent = msg; show('err', true); }
  function post(fn, args, ok, bad, prog) {
    var x = new XMLHttpRequest();
    x.open('POST', API); x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    if (prog && x.upload) x.upload.onprogress = function (e) { if (e.lengthComputable) prog(e.loaded / e.total); };
    x.onload = function () { var j = null; try { j = JSON.parse(x.responseText); } catch (er) {} if (j && j.ok) ok(j.data); else bad((j && j.error) || 'Something went wrong. Try again.'); };
    x.onerror = function () { bad('No internet. Check the connection and try again.'); };
    x.send(JSON.stringify({ fn: fn, args: args }));
  }
  function info() {
    post('appProofInfo', [T, E, S], function (d) {
      $('store').textContent = d.store; $('logo').textContent = d.store.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
      $('cour').textContent = d.courier; $('cn').textContent = d.cn; $('sub').textContent = [d.city, d.kind].filter(Boolean).join(' · ');
      document.title = 'Proof photo · ' + d.cn; $('foot').textContent = d.store + ' · only for this parcel';
      if (d.photos) { done = d.photos; $('okT').textContent = d.photos + (d.photos > 1 ? ' photos' : ' photo') + ' already uploaded'; show('ok', true); $('takeT').textContent = 'Add another photo'; }
      $('take').disabled = false; $('pick').disabled = false;
    }, function (m) { $('store').textContent = 'Proof photo'; fail(m); });
  }
  // the photo is made smaller on the phone (longest side 1600 px, JPEG) so it uploads fast on mobile data
  function shrink(file, cb) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function () { fail('This file is not a photo. Choose a JPG or PNG.'); };
    img.src = url;
  }
  function send(file) {
    if (!file || busy) return;
    show('err', false); show('ok', false);
    shrink(file, function (data) {
      busy = true; $('take').disabled = true; $('pick').disabled = true; $('takeT').textContent = 'Uploading…';
      var d = $('drop'); d.innerHTML = '<img alt="">'; d.firstChild.src = data; d.classList.add('has');
      show('bar', true); $('barI').style.width = '4%'; $('note').textContent = 'Uploading… keep this page open'; show('note', true);
      post('appProofUpload', [T, E, S, data], function (r) {
        busy = false; done++; $('barI').style.width = '100%'; show('note', false);
        $('okT').textContent = 'Uploaded · ' + r.at + (done > 1 ? ' · ' + done + ' photos' : ''); show('ok', true);
        $('note').textContent = 'Shukriya. The photo has reached ' + $('store').textContent + '.'; show('note', true);
        $('takeT').textContent = 'Add another photo'; $('take').disabled = false; $('pick').disabled = false;
      }, function (m) {
        busy = false; show('bar', false); show('note', false); fail(m); $('takeT').textContent = 'Take photo'; $('take').disabled = false; $('pick').disabled = false;
      }, function (p) { $('barI').style.width = Math.max(4, Math.round(p * 95)) + '%'; $('note').textContent = 'Uploading… ' + Math.round(p * 100) + '%'; });
    });
  }
  $('take').onclick = function () { $('cam').value = ''; $('cam').click(); };
  $('pick').onclick = function () { $('gal').value = ''; $('gal').click(); };
  $('cam').onchange = function () { send(this.files && this.files[0]); };
  $('gal').onchange = function () { send(this.files && this.files[0]); };
  if (!T || !S) { $('store').textContent = 'Proof photo'; fail('This link is not complete. Open it again from the sheet.'); } else info();
})();
</script>
</body>
</html>
